name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test
        run: >-
          xcodebuild -project ShareSlice.xcodeproj -scheme ShareSlice
          -configuration Debug -destination "platform=macOS,arch=$(uname -m)"
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test
