name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a tag such as v0.1.0.' >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Test and package universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.sh "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/Share-Slice-VERSION/Share-Slice-$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "dist/Share-Slice-$VERSION.zip" \
            --verify-tag --title "Share Slice $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
